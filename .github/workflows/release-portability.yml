name: release-portability
on: [push, pull_request]
jobs:
  cloud-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: python -m pip install "pytest>=8,<10"
      - run: python scripts/check_portability.py --root .
      - run: python scripts/validate_cloud_first.py --root .
      - run: python -m pytest -q tests/test_cloud_first_contract.py tests/test_verification_gates.py
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install "pytest>=8,<10"
      - run: python scripts/check_portability.py --root .
      - run: python scripts/run_fast_gate.py --enforce-budget
      - run: python scripts/run_golden_path_smoke.py
      - run: python scripts/run_v4_contract_tests.py --focused
      - run: python scripts/run_v3_contract_tests.py
      - run: python scripts/run_v4_contract_tests.py --full
